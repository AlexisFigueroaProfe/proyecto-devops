name: DevOps Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos requeridos
        run: |
          for f in src/index.html src/styles.css Dockerfile docker-compose.yml .env.example .gitignore README.md; do
            test -f "$f" && echo "OK: $f" || { echo "FALTA: $f"; exit 1; }
          done

      - name: Construir imagen Docker
        run: docker build -t reserva-horas-medicas:ci .

      - name: Probar el servicio
        run: |
          docker run -d --name test-web -p 8080:80 reserva-horas-medicas:ci
          sleep 3
          curl -fsS http://localhost:8080 | grep -i "Reserva"
          docker rm -f test-web
